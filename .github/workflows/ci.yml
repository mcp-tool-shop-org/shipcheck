name: CI
on:
  push:
    branches: [main]
    paths: ["bin/**", "templates/**", "contracts/**", "test/**", "dogfood/**", "package.json", "package-lock.json", ".github/workflows/**", "atlas/**", "site/package.json", "site/package-lock.json", "site/astro.config.mjs", "codecov.yml"]
  pull_request:
    paths: ["bin/**", "templates/**", "contracts/**", "test/**", "dogfood/**", "package.json", "package-lock.json", ".github/workflows/**", "atlas/**", "site/package.json", "site/package-lock.json", "site/astro.config.mjs", "codecov.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 'true' on a pull request or a push to the default branch, the runs
      # whose coverage and test results go to Codecov.
      COVERAGE_LEG: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - id: tests
        run: npm test
        # On the coverage leg every Node process the tests start leaves raw V8
        # coverage outside the tree, and the test runner also writes JUnit to
        # junit.xml where it runs; elsewhere both variables are empty, which
        # Node reads as unset.
        env:
          NODE_OPTIONS: ${{ env.COVERAGE_LEG == 'true' && '--test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml' || '' }}
          NODE_V8_COVERAGE: ${{ env.COVERAGE_LEG == 'true' && format('{0}/v8-coverage', runner.temp) || '' }}
      # One lcov report from the raw coverage every Node process of the
      # tests left. The exact version keeps npx from fetching whichever c8
      # is newest on the day.
      - name: Coverage report for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        run: npx --yes c8@12.0.0 report --temp-directory "$RUNNER_TEMP/v8-coverage" --reporter=lcov --reporter=text-summary --report-dir coverage/c8
      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/c8/lcov.info
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - run: npm run verify
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: verify
    if: ${{ !cancelled() && needs.verify.result != 'cancelled' && needs.verify.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage/c8
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .
      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('coverage/c8/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/c8/lcov.info
      - name: Upload test results to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  dogfood:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # --- Scenario: self-gate-real-repo ---

      - name: "Step: run-help"
        id: help
        run: |
          node bin/shipcheck.mjs help 2>&1 | tee /tmp/help.log
          echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: "Step: run-init"
        id: init
        run: |
          node bin/shipcheck.mjs init 2>&1 | tee /tmp/init.log
          if [ -f "SHIP_GATE.md" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: "Step: run-audit"
        id: audit
        run: |
          # audit may exit 3 (partial) which is valid
          set +e
          node bin/shipcheck.mjs audit 2>&1 | tee /tmp/audit.log
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 0 ] || [ "$EXIT_CODE" -eq 3 ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: "Step: verify-output"
        id: verify_output
        run: |
          # Check audit log contains gate results (shipcheck outputs summary lines)
          if grep -q -E "(Checked:|Unchecked:|Skipped:|Pass rate:)" /tmp/audit.log; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      # --- Assemble submission ---

      - name: Determine overall verdict
        id: verdict
        run: |
          HELP="${{ steps.help.outputs.status }}"
          INIT="${{ steps.init.outputs.status }}"
          AUDIT="${{ steps.audit.outputs.status }}"
          VERIFY="${{ steps.verify_output.outputs.status }}"
          if [ "$HELP" = "pass" ] && [ "$INIT" = "pass" ] && [ "$AUDIT" = "pass" ] && [ "$VERIFY" = "pass" ]; then
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Build submission
        run: |
          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > /tmp/submission.json << 'INNER_EOF'
          {
            "schema_version": "1.0.0",
            "run_id": "shipcheck-RUN_ID-ATTEMPT",
            "repo": "REPO_SLUG",
            "ref": {
              "branch": "REF_NAME",
              "commit_sha": "COMMIT_SHA"
            },
            "source": {
              "provider": "github",
              "workflow": "ci.yml",
              "provider_run_id": "PROVIDER_RUN_ID",
              "attempt": ATTEMPT_NUM,
              "run_url": "RUN_URL_PLACEHOLDER",
              "actor": "ACTOR_NAME"
            },
            "timing": {
              "started_at": "STARTED_PLACEHOLDER",
              "finished_at": "FINISHED_PLACEHOLDER",
              "duration_ms": 0
            },
            "ci_checks": [
              { "id": "unit-tests", "kind": "test", "status": "pass", "value": 24 }
            ],
            "scenario_results": [
              {
                "scenario_id": "self-gate-real-repo",
                "scenario_name": "Self-gate against real repo",
                "scenario_version": "1.0.0",
                "product_surface": "cli",
                "execution_mode": "bot",
                "verdict": "VERDICT_PLACEHOLDER",
                "step_results": [
                  { "step_id": "run-help", "status": "HELP_STATUS" },
                  { "step_id": "run-init", "status": "INIT_STATUS" },
                  { "step_id": "run-audit", "status": "AUDIT_STATUS" },
                  { "step_id": "verify-output", "status": "VERIFY_STATUS" }
                ],
                "evidence": [
                  {
                    "kind": "log",
                    "url": "RUN_URL_PLACEHOLDER",
                    "description": "CI run log with audit output"
                  },
                  {
                    "kind": "artifact",
                    "url": "RUN_URL_PLACEHOLDER/artifacts",
                    "description": "Audit log artifact (dogfood-audit-log)"
                  }
                ],
                "notes": "Self-gate audit exit code: EXIT_CODE_PLACEHOLDER"
              }
            ],
            "overall_verdict": "VERDICT_PLACEHOLDER",
            "notes": "Pilot 1: shipcheck self-dogfood."
          }
          INNER_EOF

          # Replace placeholders with actual values
          sed -i "s|REPO_SLUG|${GITHUB_REPOSITORY}|g" /tmp/submission.json
          sed -i "s|REF_NAME|${GITHUB_REF_NAME}|g" /tmp/submission.json
          sed -i "s|COMMIT_SHA|${GITHUB_SHA}|g" /tmp/submission.json
          sed -i "s|PROVIDER_RUN_ID|${GITHUB_RUN_ID}|g" /tmp/submission.json
          sed -i "s|ATTEMPT_NUM|${GITHUB_RUN_ATTEMPT}|g" /tmp/submission.json
          sed -i "s|RUN_URL_PLACEHOLDER|https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|g" /tmp/submission.json
          sed -i "s|ACTOR_NAME|${GITHUB_ACTOR}|g" /tmp/submission.json
          sed -i "s|STARTED_PLACEHOLDER|${{ github.event.head_commit.timestamp }}|g" /tmp/submission.json
          sed -i "s|FINISHED_PLACEHOLDER|${FINISHED_AT}|g" /tmp/submission.json
          sed -i "s|shipcheck-RUN_ID-ATTEMPT|shipcheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}|g" /tmp/submission.json
          sed -i "s|VERDICT_PLACEHOLDER|${{ steps.verdict.outputs.verdict }}|g" /tmp/submission.json
          sed -i "s|HELP_STATUS|${{ steps.help.outputs.status }}|g" /tmp/submission.json
          sed -i "s|INIT_STATUS|${{ steps.init.outputs.status }}|g" /tmp/submission.json
          sed -i "s|AUDIT_STATUS|${{ steps.audit.outputs.status }}|g" /tmp/submission.json
          sed -i "s|VERIFY_STATUS|${{ steps.verify_output.outputs.status }}|g" /tmp/submission.json
          sed -i "s|EXIT_CODE_PLACEHOLDER|${{ steps.audit.outputs.exit_code }}|g" /tmp/submission.json

          # Validate JSON
          jq empty /tmp/submission.json
          echo "Submission built:"
          jq '.run_id, .overall_verdict' /tmp/submission.json

      - name: Upload audit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-audit-log
          path: /tmp/audit.log
          retention-days: 30

      - name: Dispatch to dogfood-labs
        env:
          GH_TOKEN: ${{ secrets.DOGFOOD_TOKEN }}
        run: |
          SUBMISSION=$(cat /tmp/submission.json)
          RUN_ID=$(echo "$SUBMISSION" | jq -r '.run_id')

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOGFOOD_TOKEN not set — skipping dispatch"
            exit 0
          fi

          # Build payload with submission as a proper JSON object (not string).
          # Best-effort: the payload is already validated by the blocking `jq empty`
          # in "Build submission" above, so only the outbound call is tolerant here.
          # An expired or unscoped DOGFOOD_TOKEN must not redden a mainline whose
          # product gates all passed -- it surfaces as a run-summary warning instead.
          if jq -n --argjson sub "$SUBMISSION" \
            '{"event_type":"dogfood_submission","client_payload":{"submission":$sub}}' \
            | gh api repos/dogfood-lab/testing-os/dispatches \
              --input - --silent
          then
            echo "Dispatched $RUN_ID to testing-os"
          else
            echo "::warning::Dispatch of $RUN_ID to dogfood-lab/testing-os failed (check DOGFOOD_TOKEN validity and scope) -- not failing the build"
          fi
